- aid: discover:discover-payment-account-reference
  name: Discover Payment Account Reference
  tags:
  - Payments
  - Tokenization
  - PAR
  - EMVCo
  - Reference Data
  humanURL: https://partner.discoverglobalnetwork.com/products/payment-account-reference?tab=overview
  baseURL: https://apis.discover.com
  properties:
  - url: https://partner.discoverglobalnetwork.com/products/payment-account-reference?tab=overview
    type: Documentation
  - url: https://partner.discoverglobalnetwork.com/products/payment-account-reference?tab=api-specs
    type: APIReference
  description: Payment Account Reference (PAR) gives merchants and solution providers an aggregated
    view of a customer's account without exposing the PAN or the payment token. PAR is the EMVCo-defined
    non-financial reference value that correlates every transaction on one card account whether it
    was made with a PAN or with a payment token, which is what makes loyalty, dispute and risk analytics
    work across tokenized and untokenized channels. Discover offers PAR as an optional add-on to
    its tokenization products, and PAR absence is a first-class error condition in the Stored Token
    Services error registry (code 10005).
- aid: discover:discover-iin-data-lookup-service
  name: Discover IIN Data Lookup Service
  tags:
  - BIN
  - IIN
  - Reference Data
  - Payments
  - Card Network
  humanURL: https://partner.discoverglobalnetwork.com/products/iin-data-lookup?tab=overview
  baseURL: https://rangerx-api.discoverfinancial.com/epp/rangerx/v1
  properties:
  - url: https://partner.discoverglobalnetwork.com/products/iin-data-lookup?tab=overview
    type: Documentation
  - url: https://partner.discoverglobalnetwork.com/products/iin-data-lookup?tab=api-specs
    type: APIReference
  description: The IIN Data Lookup Service returns up-to-date Issuer Identification Number (BIN)
    range data so an acquirer, processor or merchant can identify the issuer, the card product and
    the network behind a card number before routing or authorising a transaction. The published surface
    includes a full IIN list, a simplified summary list, a per-network summary and a single-IIN lookup
    that returns every field attribute for one range, alongside a health check. It is the one Discover
    API product documented with real GET reads rather than the POST-dominant pattern the rest of
    the portfolio uses.
- aid: discover:discover-network-account-updater
  name: Discover Network Account Updater
  tags:
  - Payments
  - Recurring Billing
  - Card on File
  - Account Updater
  - Credit Cards
  humanURL: https://partner.discoverglobalnetwork.com/products/discover-network-account-updater?tab=overview
  baseURL: https://apis.discover.com
  properties:
  - url: https://partner.discoverglobalnetwork.com/products/discover-network-account-updater?tab=overview
    type: Documentation
  - url: https://partner.discoverglobalnetwork.com/products/discover-network-account-updater?tab=api-specs
    type: APIReference
  description: Discover Network Account Updater keeps recurring and stored card-on-file payment credentials
    current so merchants can keep processing payments without interruption when a card is reissued,
    renumbered or re-expired. Requestors submit inquiry requests for enrolled accounts and receive
    updated account information; the published error registry documents PAN validation (Luhn), cryptographic
    failures on the encrypted account payload, and an enrollment eligibility check that rejects requestors
    who are not boarded for Account Updater.
- aid: discover:discover-issuer-card-account-services
  name: Discover Issuer Card Account Services
  tags:
  - Issuing
  - Card Management
  - Payments
  - Enrollment
  - Credit Cards
  humanURL: https://partner.discoverglobalnetwork.com/products/issuer-card-account-services?tab=overview
  baseURL: https://apis.discover.com
  properties:
  - url: https://partner.discoverglobalnetwork.com/products/issuer-card-account-services?tab=overview
    type: Documentation
  - url: https://partner.discoverglobalnetwork.com/products/issuer-card-account-services?tab=api-specs
    type: APIReference
  description: Issuer Card Account Services (iCAS) is the Discover Global Network capability issuers
    use to manage changes to card accounts across the life of the account. The published surface
    documents a bulk card-account enrollment operation that also updates card product codes, with
    validation at the account-key level and partial success allowed at the request level, plus a
    health check. Account information must be encrypted in the request, with decryption and validation
    performed server side.

  - url: https://partner.discoverglobalnetwork.com/products/discover-stored-token-services?tab=api-specs
    type: APIReference
  - url: https://www.discoverglobalnetwork.com/solutions/fraud-security/stored-payment-tokens/
    type: Solutions
  description: Discover Stored Token Services (DSTS) replaces a customer's Primary Account Number
    (PAN) with a unique, secure payment token at checkout, for card-on-file, wallet and in-app commerce.
    The API surface covers token requestor boarding, token provisioning and lifecycle state changes
    (link, unlink, suspend, resume), cryptogram generation for tokenized transactions, card asset
    retrieval and an Account Notification webhook that carries issuer-initiated account updates back
    to the token requestor. Requests use OAuth 2.0 client credentials plus a second-factor JWT, JWE
    payload encryption and mTLS on Discover's outgoing calls. Formerly listed as Discover Stored
    Payment Tokens; the /products/stored-payment-tokens page no longer resolves.
  baseURL: https://apis.discover.com

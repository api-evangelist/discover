description: 'Discover Financial Services is a US consumer bank and payments network - credit cards,
  personal loans, student loans, home equity loans, and online savings and checking accounts - and,
  through Discover Global Network, one of the four global card acceptance networks, alongside the
  Diners Club International and PULSE brands. Its developer-facing business is the network side:
  issuers, acquirers, processors, wallet providers and token requestors integrate through the Discover
  Partner Product Portal and the invitation-only Discover Developer Center for tokenization, account
  updating, IIN/BIN lookup, fraud alerts, enhanced decisioning and a set of travel and acceptance
  tools. Discover''s footer now reads "Discover, a division of Capital One, N.A., Member FDIC".'

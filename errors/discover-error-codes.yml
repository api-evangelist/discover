# Discover published error-code registry - harvested, not derived.
generated: '2026-09-06'
method: searched
source: https://partner.discoverglobalnetwork.com/products/discover-stored-token-services?tab=api-specs
docs: https://partner.discoverglobalnetwork.com/products/discover-stored-token-services?tab=api-specs
format: vendor
note: 'Discover publishes no OpenAPI, so this registry is read from the published API Specs tabs on the
  Discover Partner Product Portal (server-rendered content, fetched 2026-09-06). Errors are NOT RFC 9457
  problem+json: the envelope is a MessageInfo object with `code` (string) and `message` (human readable),
  and one response may carry several messages.'
envelope:
  media_type: application/json
  shape: '{ "code": "<string>", "message": "<string>" }'
  multiple_messages: true
  fields:
  - name: code
    presence: mandatory
    type: String
    description: Error or Warning code
  - name: message
    presence: mandatory
    type: String
    description: Human readable description of the error or warning
  example:
    code: '20001'
    message: Invalid PAN
code_families:
- prefix: 6 / 1001 / 1003 / 1006 / 30001 / 30002 / 9000x
  meaning: Gateway-level errors returned by any Discover API regardless of product
  see: errors/discover-problem-types.yml
- prefix: 0000x
  meaning: Wallet program / issuer routing errors
- prefix: 100xx
  meaning: Card, PAN, token, device and provisioning errors
- prefix: 101xx
  meaning: Token lifecycle, OTP and channel errors
- prefix: 300xx
  meaning: Downstream processing and OTP errors
- prefix: 700xx
  meaning: Issuer / BIN range lookup errors
- prefix: 900xx
  meaning: Request payload and HTTP header validation errors
- prefix: '20001'
  meaning: Account Updater enrollment errors

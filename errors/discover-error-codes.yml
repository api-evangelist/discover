account_updater_error_codes:
  source: https://partner.discoverglobalnetwork.com/products/discover-network-account-updater?tab=api-specs
  note: In addition to the generic gateway error codes.
  codes:
  - code: '10001'
    message: Invalid PAN
    description: This will be returned when basic validation on the PAN is performed such as a Luhn check
    action: Re-submit with the Valid PAN
  - code: '10006'
    message: Cryptographic Error
    description: This will be returned if there is an issue when trying to decrypt or encrypt any sensitive
      information
    action: Resubmit with valid encryption certificate or valid encryption content
  - code: '20001'
    message: Requestor not enrolled for Account Updater
    description: Requestor not enrolled for Account Updater
    action: Requestor is not eligible to submit Account Updater inquiry requests. Requestor needs to contact
      Discover Network before retrying

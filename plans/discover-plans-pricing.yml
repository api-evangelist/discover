access_model:
  self_service: false
  free_tier: false
  trial: false
  path: >-
    Contact Us form at https://partner.discoverglobalnetwork.com/contact-us, or an invitation from
    a Discover representative. "Currently, portal access is by invitation only."
  contract: service agreement between the partner and Discover
api_plans:
  note: >-
    Discover's "API Plan" is an entitlement and routing token, not a priced tier. Plan names are
    "determined by each API Product and provided to the partner in the Discover Developer Center
    following Discover review", and the plan is sent on every call in X-DFS-API-PLAN.
  environments:
    - name: Sandbox
      endpoint: sandbox.apis.discover.com
    - name: Certification
      endpoint: sandbox.apis.discover.com
    - name: Production
      endpoint: apis.discover.com
  source: https://partner.discoverglobalnetwork.com/products/discover-stored-token-services?tab=api-specs

description: >-
  Discover publishes NO pricing and NO plans for its Global Network APIs. Access is contractual: a
  partner is invited, signs a service agreement, and is then issued an "API Plan" that routes calls
  to Sandbox, Certification or Production and carries the commercial terms. This file REPLACES a
  2026-05-04 bulk-sweep scaffold that invented Free/Pro-style tiers with request quotas; none of
  those figures came from Discover and they have been removed rather than carried forward.
